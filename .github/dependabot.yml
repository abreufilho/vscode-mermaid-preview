version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Actions are pinned to commit SHAs, which never update on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
