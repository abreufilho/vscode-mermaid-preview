version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Pinned to the floor declared in engines.vscode. Newer types would let
      # the compiler accept APIs missing from the oldest supported editor, and
      # the extension would fail there at runtime. Raise both together or
      # neither.
      - dependency-name: '@types/vscode'

  # Actions are pinned to commit SHAs, which never update on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
