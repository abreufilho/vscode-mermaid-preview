version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Pinned to the floor declared in engines.vscode. Newer types would let
      # the compiler accept APIs missing from the oldest supported editor, and
      # the extension would fail there at runtime. Raise both together or
      # neither.
      - dependency-name: '@types/vscode'
      # typescript-eslint 8 does not accept TypeScript 7 as a peer, so raising
      # the compiler on its own breaks npm ci. Majors move when both can move.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Actions are pinned to commit SHAs, which never update on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
