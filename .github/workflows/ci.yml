name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declared per job rather than for the whole workflow, so a job added later
    # starts from no permissions instead of inheriting these.
    permissions:
      contents: read

    steps:
      # Actions are pinned to a commit: a tag can be moved to point at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # Packaging is part of verification: a manifest or .vscodeignore mistake
      # only shows up when the VSIX is assembled.
      - run: npx vsce package --out mermaid-preview.vsix

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: mermaid-preview.vsix
