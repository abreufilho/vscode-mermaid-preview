name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a rule added after the last commit still reaches this code.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    # Code scanning is free on public repositories and requires Advanced
    # Security on private ones, so this skips instead of failing while private.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # v2.26.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # v2.26.2
