name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      # The tag drives the artefact name, so a mismatch with the manifest would
      # publish a file whose name contradicts the extension it carries.
      - name: Check tag against manifest version
        run: |
          set -euo pipefail
          manifest="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $tag does not match package.json $manifest" >&2
            exit 1
          fi

      - run: npx vsce package --out "mermaid-preview-${GITHUB_REF_NAME#v}.vsix"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "mermaid-preview-${GITHUB_REF_NAME#v}.vsix" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install with: code --install-extension mermaid-preview-${GITHUB_REF_NAME#v}.vsix"
